[package]
name = "noir"
version = "1.0.0-beta.16-garaga"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
acir = { git = "https://github.com/noir-lang/noir.git", rev = "2d46fca7203545cbbfb31a0d0328de6c10a8db95" }
acvm = { git = "https://github.com/noir-lang/noir.git", rev = "2d46fca7203545cbbfb31a0d0328de6c10a8db95" }
acvm_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "2d46fca7203545cbbfb31a0d0328de6c10a8db95" }
base64 = "0.22.0"
bincode = "1.3.3"
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "2d46fca7203545cbbfb31a0d0328de6c10a8db95" }
flate2 = "1.0.28"
hex = "0.4.3"
nargo = { git = "https://github.com/noir-lang/noir.git", rev = "2d46fca7203545cbbfb31a0d0328de6c10a8db95" }
reqwest = { version = "0.12.1", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
serde = "1.0.197"
thiserror = "1.0.58"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0.125"
clap = { version = "4.4.8", features = ["derive"] }
proptest = "=1.6.0"
base64ct = { version = "=1.7" }

# Optional dependencies
bb = { package = "bb_rs", git = "https://github.com/Mohiiit/aztec-packages.git", rev = "c3d0ee1ef59086777b20b3b7bd53734274230275", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
default = []
barretenberg = ["bb"]
android-compat = ["openssl"]
srs-downloader = ["barretenberg"]
ios-build = ["barretenberg"]
android-build = ["barretenberg", "openssl"]

[[bin]]
name = "srs_downloader"
path = "src/bin/srs_downloader.rs"
required-features = ["srs-downloader"]

[dev-dependencies]
tempfile = "3.8.1"
